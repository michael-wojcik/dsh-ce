name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check release state
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-ce@$version" version >/dev/null 2>&1; then
            echo "state=published" >> "$GITHUB_OUTPUT"
          elif npm stage list dsh-ce 2>/dev/null | grep -q "version: $version"; then
            echo "state=staged" >> "$GITHUB_OUTPUT"
          else
            echo "state=new" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage the release for maintainer approval
        if: steps.check.outputs.state == 'new'
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report approval step
        run: |
          echo "Release state: ${{ steps.check.outputs.state }}"
          if [ "${{ steps.check.outputs.state }}" = "new" ]; then
            echo "::notice::Staged `dsh-ce@$(node -p "require('./package.json').version")`. A maintainer approves it with 2FA in npm Settings -> Staged Packages."
          fi
